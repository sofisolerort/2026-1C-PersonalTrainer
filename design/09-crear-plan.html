<!doctype html>

<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>AC Training - Edición de Plan</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container": "#ededf9",
              "on-secondary-fixed-variant": "#005236",
              "inverse-surface": "#2e3039",
              error: "#ba1a1a",
              primary: "#004ac6",
              "on-tertiary": "#ffffff",
              "surface-container-lowest": "#ffffff",
              "on-primary-fixed": "#00174b",
              "surface-container-high": "#e7e7f3",
              "error-container": "#ffdad6",
              outline: "#737686",
              "on-surface-variant": "#434655",
              "on-secondary": "#ffffff",
              "on-primary": "#ffffff",
              "inverse-on-surface": "#f0f0fb",
              "outline-variant": "#c3c6d7",
              "surface-tint": "#0053db",
              secondary: "#006c49",
              "primary-container": "#2563eb",
              "tertiary-fixed": "#ffdbcd",
              "on-error": "#ffffff",
              "surface-variant": "#e1e2ed",
              "primary-fixed": "#dbe1ff",
              surface: "#faf8ff",
              background: "#faf8ff",
              "surface-bright": "#faf8ff",
              "on-secondary-fixed": "#002113",
              "secondary-container": "#6cf8bb",
              "on-background": "#191b23",
              tertiary: "#943700",
              "on-tertiary-fixed-variant": "#7d2d00",
              "on-primary-fixed-variant": "#003ea8",
              "primary-fixed-dim": "#b4c5ff",
              "on-primary-container": "#eeefff",
              "tertiary-container": "#bc4800",
              "surface-container-low": "#f3f3fe",
              "secondary-fixed-dim": "#4edea3",
              "on-surface": "#191b23",
              "inverse-primary": "#b4c5ff",
              "on-tertiary-container": "#ffede6",
              "on-secondary-container": "#00714d",
              "tertiary-fixed-dim": "#ffb596",
              "secondary-fixed": "#6ffbbe",
              "on-tertiary-fixed": "#360f00",
              "surface-dim": "#d9d9e5",
              "surface-container-highest": "#e1e2ed",
              "on-error-container": "#93000a",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              xxl: "48px",
              xs: "4px",
              lg: "24px",
              md: "16px",
              container_max_width: "1280px",
              gutter: "24px",
              sm: "8px",
              xl: "32px",
              base: "4px",
            },
            fontFamily: {
              h3: ["Inter"],
              "label-caps": ["Inter"],
              button: ["Inter"],
              "body-lg": ["Inter"],
              h1: ["Inter"],
              "body-sm": ["Inter"],
              "body-md": ["Inter"],
              h2: ["Inter"],
            },
            fontSize: {
              h3: ["24px", { lineHeight: "1.3", fontWeight: "600" }],
              "label-caps": [
                "12px",
                { lineHeight: "1", letterSpacing: "0.05em", fontWeight: "600" },
              ],
              button: ["16px", { lineHeight: "1", fontWeight: "600" }],
              "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
              h1: [
                "36px",
                {
                  lineHeight: "1.2",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "body-sm": ["14px", { lineHeight: "1.5", fontWeight: "400" }],
              "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
              h2: [
                "30px",
                {
                  lineHeight: "1.2",
                  letterSpacing: "-0.01em",
                  fontWeight: "700",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        vertical-align: middle;
      }
      ::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-[#F9FAFB] text-on-background font-body-md antialiased min-h-screen pb-32"
  >
    <!-- Top AppBar (Back Action, Header) -->
    <nav
      class="bg-surface shadow-sm sticky top-0 z-50 flex items-center justify-between px-md py-sm w-full h-16"
    >
      <div class="flex items-center gap-md">
        <button
          class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors"
        >
          <span
            class="material-symbols-outlined text-primary"
            data-icon="arrow_back"
            >arrow_back</span
          >
        </button>
        <div>
          <h1 class="font-h3 text-[20px] leading-tight text-on-surface">
            Plan de Ana García
          </h1>
          <p class="font-body-sm text-on-surface-variant">
            Hipertrofia • 4 días por semana
          </p>
        </div>
      </div>
      <div
        class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center overflow-hidden border border-outline-variant"
      >
        <img
          alt="User"
          class="w-full h-full object-cover"
          data-alt="A professional portrait of a woman in her 30s with a focused expression, wearing athletic apparel. The background is a soft-focus gym environment with cool, high-key lighting, maintaining a clean and premium fitness brand aesthetic. The color palette features whites and subtle blues."
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuBzhcTDoDdkPkVhVS-KyzSOiEy062TdXwiBojYty0HCje5pejxSBUqAHxnsEMOuMf0hLJD-v1rX2ugIVgkz4-pJ26nHcu0QAqwSdBS-_zXgFmpibadLvGmvGxSWxKelDLt0wAFyqla0bgw94lt5UwuJPDCfwvXX1rXDLoQCHa0owvJxsKaFRRDK_RWfqX6IQsFqUJeGd2K_xNeI4xzs2BMa38KIVnuSnKs8y4SFtWbPeNagZFM037ddyMpH1qKggpp6jq8Oqp66gkM"
        />
      </div>
    </nav>
    <main class="max-w-md mx-auto p-md space-y-lg">
      <!-- Information Card -->
      <section
        class="bg-white rounded-xl border border-outline-variant p-lg shadow-[0_4px_20px_rgba(0,0,0,0.03)] space-y-md"
      >
        <div class="space-y-sm">
          <label class="font-label-caps text-on-surface-variant block"
            >NOMBRE DEL PLAN</label
          >
          <input
            class="w-full h-12 rounded-lg border-outline-variant px-md focus:border-primary focus:ring-1 focus:ring-primary text-body-md font-semibold"
            type="text"
            value="Hipertrofia Avanzada V2"
          />
        </div>
        <div class="space-y-sm">
          <label class="font-label-caps text-on-surface-variant block"
            >DESCRIPCIÓN</label
          >
          <textarea
            class="w-full rounded-lg border-outline-variant p-md focus:border-primary focus:ring-1 focus:ring-primary text-body-md min-h-[80px]"
          >
Enfoque en tren superior con énfasis en deltoides y espalda. RPE 8-9.</textarea
          >
        </div>
        <div class="grid grid-cols-2 gap-md">
          <div class="space-y-sm">
            <label class="font-label-caps text-on-surface-variant block"
              >FECHA INICIO</label
            >
            <input
              class="w-full h-12 rounded-lg border-outline-variant px-md focus:border-primary focus:ring-1 focus:ring-primary text-body-sm"
              type="date"
              value="2024-05-01"
            />
          </div>
          <div class="space-y-sm">
            <label class="font-label-caps text-on-surface-variant block"
              >FECHA FIN</label
            >
            <input
              class="w-full h-12 rounded-lg border-outline-variant px-md focus:border-primary focus:ring-1 focus:ring-primary text-body-sm"
              type="date"
              value="2024-06-30"
            />
          </div>
        </div>
        <div class="space-y-sm">
          <label class="font-label-caps text-on-surface-variant block"
            >ESTADO</label
          >
          <div class="flex gap-sm">
            <button
              class="px-md py-sm rounded-full bg-primary text-on-primary font-button text-body-sm"
            >
              Activo
            </button>
            <button
              class="px-md py-sm rounded-full bg-surface-container border border-outline-variant text-on-surface-variant font-button text-body-sm"
            >
              Pausado
            </button>
            <button
              class="px-md py-sm rounded-full bg-surface-container border border-outline-variant text-on-surface-variant font-button text-body-sm"
            >
              Finalizado
            </button>
          </div>
        </div>
      </section>
      <!-- Days Navigation Tabs -->
      <section class="overflow-x-auto no-scrollbar -mx-md px-md">
        <div class="flex items-center gap-sm">
          <button
            class="flex flex-col items-center justify-center min-w-[56px] h-20 rounded-xl bg-white border border-primary text-primary shadow-sm relative"
          >
            <span class="font-label-caps">LUN</span>
            <span class="font-h3 text-xl">1</span>
            <div
              class="absolute top-2 right-2 w-2 h-2 bg-primary rounded-full"
            ></div>
          </button>
          <button
            class="flex flex-col items-center justify-center min-w-[56px] h-20 rounded-xl bg-white border border-outline-variant text-on-surface-variant"
          >
            <span class="font-label-caps">MAR</span>
            <span class="font-h3 text-xl">2</span>
            <div
              class="absolute top-2 right-2 w-2 h-2 bg-primary rounded-full"
            ></div>
          </button>
          <button
            class="flex flex-col items-center justify-center min-w-[56px] h-20 rounded-xl bg-surface-container-low border border-outline-variant text-outline opacity-60"
          >
            <span class="font-label-caps">MIÉ</span>
            <span class="font-h3 text-xl">3</span>
          </button>
          <button
            class="flex flex-col items-center justify-center min-w-[56px] h-20 rounded-xl bg-white border border-outline-variant text-on-surface-variant relative"
          >
            <span class="font-label-caps">JUE</span>
            <span class="font-h3 text-xl">4</span>
            <div
              class="absolute top-2 right-2 w-2 h-2 bg-primary rounded-full"
            ></div>
          </button>
          <button
            class="flex flex-col items-center justify-center min-w-[56px] h-20 rounded-xl bg-white border border-outline-variant text-on-surface-variant relative"
          >
            <span class="font-label-caps">VIE</span>
            <span class="font-h3 text-xl">5</span>
            <div
              class="absolute top-2 right-2 w-2 h-2 bg-primary rounded-full"
            ></div>
          </button>
          <button
            class="flex flex-col items-center justify-center min-w-[56px] h-20 rounded-xl bg-surface-container-low border border-outline-variant text-outline opacity-60"
          >
            <span class="font-label-caps">SÁB</span>
            <span class="font-h3 text-xl">6</span>
          </button>
          <button
            class="flex flex-col items-center justify-center min-w-[56px] h-20 rounded-xl bg-surface-container-low border border-outline-variant text-outline opacity-60"
          >
            <span class="font-label-caps">DOM</span>
            <span class="font-h3 text-xl">7</span>
          </button>
        </div>
      </section>
      <!-- Routine Header -->
      <section
        class="bg-white rounded-xl border border-outline-variant p-lg shadow-sm"
      >
        <div class="space-y-md">
          <div class="space-y-sm">
            <label class="font-label-caps text-on-surface-variant block"
              >NOMBRE DE LA RUTINA</label
            >
            <input
              class="w-full h-12 rounded-lg border-outline-variant px-md focus:border-primary focus:ring-1 focus:ring-primary text-body-md font-semibold"
              type="text"
              value="Empuje (Pecho, Hombro, Tríceps)"
            />
          </div>
          <div class="space-y-sm">
            <label class="font-label-caps text-on-surface-variant block"
              >NOTAS PARA EL CLIENTE</label
            >
            <textarea
              class="w-full rounded-lg border-outline-variant p-md focus:border-primary focus:ring-1 focus:ring-primary text-body-sm min-h-[60px]"
              placeholder="Ej: Controlar la fase excéntrica en todo momento..."
            ></textarea>
          </div>
        </div>
      </section>
      <!-- Exercises List -->
      <section class="space-y-md">
        <h3 class="font-h3 text-lg px-xs">Ejercicios</h3>
        <!-- Exercise Item 1 -->
        <div
          class="bg-white rounded-xl border border-outline-variant p-md shadow-sm relative group"
        >
          <div class="flex items-start gap-md">
            <div
              class="flex-none w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-sm"
            >
              1
            </div>
            <div class="flex-grow space-y-md">
              <div class="flex justify-between items-center">
                <span class="font-h3 text-md text-on-surface"
                  >Press de Banca Plano</span
                >
                <div class="flex gap-xs">
                  <button
                    class="p-1 text-outline hover:text-primary transition-colors"
                  >
                    <span
                      class="material-symbols-outlined"
                      data-icon="drag_indicator"
                      >drag_indicator</span
                    >
                  </button>
                  <button
                    class="p-1 text-outline hover:text-error transition-colors"
                  >
                    <span class="material-symbols-outlined" data-icon="delete"
                      >delete</span
                    >
                  </button>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-sm">
                <div class="space-y-xs">
                  <label
                    class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider"
                    >Series</label
                  >
                  <input
                    class="w-full h-10 rounded-lg border-outline-variant text-center text-body-sm font-semibold"
                    type="text"
                    value="4"
                  />
                </div>
                <div class="space-y-xs">
                  <label
                    class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider"
                    >Reps</label
                  >
                  <input
                    class="w-full h-10 rounded-lg border-outline-variant text-center text-body-sm font-semibold"
                    type="text"
                    value="8-10"
                  />
                </div>
                <div class="space-y-xs">
                  <label
                    class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider"
                    >Descanso</label
                  >
                  <input
                    class="w-full h-10 rounded-lg border-outline-variant text-center text-body-sm font-semibold"
                    type="text"
                    value="120''"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- Exercise Item 2 -->
        <div
          class="bg-white rounded-xl border border-outline-variant p-md shadow-sm relative group"
        >
          <div class="flex items-start gap-md">
            <div
              class="flex-none w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-sm"
            >
              2
            </div>
            <div class="flex-grow space-y-md">
              <div class="flex justify-between items-center">
                <span class="font-h3 text-md text-on-surface"
                  >Aperturas con Mancuernas</span
                >
                <div class="flex gap-xs">
                  <button
                    class="p-1 text-outline hover:text-primary transition-colors"
                  >
                    <span
                      class="material-symbols-outlined"
                      data-icon="drag_indicator"
                      >drag_indicator</span
                    >
                  </button>
                  <button
                    class="p-1 text-outline hover:text-error transition-colors"
                  >
                    <span class="material-symbols-outlined" data-icon="delete"
                      >delete</span
                    >
                  </button>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-sm">
                <div class="space-y-xs">
                  <label
                    class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider"
                    >Series</label
                  >
                  <input
                    class="w-full h-10 rounded-lg border-outline-variant text-center text-body-sm font-semibold"
                    type="text"
                    value="3"
                  />
                </div>
                <div class="space-y-xs">
                  <label
                    class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider"
                    >Reps</label
                  >
                  <input
                    class="w-full h-10 rounded-lg border-outline-variant text-center text-body-sm font-semibold"
                    type="text"
                    value="12"
                  />
                </div>
                <div class="space-y-xs">
                  <label
                    class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider"
                    >Descanso</label
                  >
                  <input
                    class="w-full h-10 rounded-lg border-outline-variant text-center text-body-sm font-semibold"
                    type="text"
                    value="90''"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- Add Exercise Button -->
        <button
          class="w-full border-2 border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center gap-sm text-outline hover:border-primary hover:text-primary transition-all group"
        >
          <span
            class="material-symbols-outlined text-3xl group-hover:scale-110 transition-transform"
            data-icon="add_circle"
            >add_circle</span
          >
          <span class="font-button">Agregar ejercicio</span>
        </button>
      </section>
    </main>
    <!-- Footer Sticky Button -->
    <footer
      class="fixed bottom-0 left-0 right-0 p-md bg-white/80 backdrop-blur-md border-t border-outline-variant z-50"
    >
      <div class="max-w-md mx-auto">
        <button
          class="w-full h-14 bg-primary text-on-primary rounded-xl font-button text-lg shadow-lg active:scale-95 transition-all flex items-center justify-center gap-md"
        >
          <span class="material-symbols-outlined" data-icon="save">save</span>
          Guardar cambios
        </button>
      </div>
    </footer>
    <!-- Bottom Nav Bar (Hidden for focused task as per rules, but placeholder if needed for context) -->
    <!-- The prompt requested a sticky Save button as footer, so we prioritize that content shell -->
  </body>
</html>
