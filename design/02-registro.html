<!doctype html>

<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-primary-container": "#eeefff",
              background: "#faf8ff",
              "primary-fixed-dim": "#b4c5ff",
              "on-surface": "#191b23",
              "on-primary": "#ffffff",
              "surface-variant": "#e1e2ed",
              "surface-container-low": "#f3f3fe",
              error: "#ba1a1a",
              outline: "#737686",
              "tertiary-fixed-dim": "#ffb596",
              "on-error-container": "#93000a",
              "inverse-surface": "#2e3039",
              "on-secondary-fixed": "#002113",
              tertiary: "#943700",
              "outline-variant": "#c3c6d7",
              "surface-container-high": "#e7e7f3",
              surface: "#faf8ff",
              "on-background": "#191b23",
              "error-container": "#ffdad6",
              "on-surface-variant": "#434655",
              "tertiary-container": "#bc4800",
              "secondary-fixed-dim": "#4edea3",
              primary: "#004ac6",
              "tertiary-fixed": "#ffdbcd",
              "secondary-container": "#6cf8bb",
              "surface-container-lowest": "#ffffff",
              "surface-container": "#ededf9",
              "on-tertiary": "#ffffff",
              "on-secondary-container": "#00714d",
              "primary-container": "#2563eb",
              "surface-dim": "#d9d9e5",
              "secondary-fixed": "#6ffbbe",
              "on-error": "#ffffff",
              "inverse-on-surface": "#f0f0fb",
              "surface-tint": "#0053db",
              "on-secondary-fixed-variant": "#005236",
              "on-tertiary-container": "#ffede6",
              "on-tertiary-fixed": "#360f00",
              "on-primary-fixed": "#00174b",
              "primary-fixed": "#dbe1ff",
              secondary: "#006c49",
              "surface-bright": "#faf8ff",
              "on-secondary": "#ffffff",
              "on-tertiary-fixed-variant": "#7d2d00",
              "on-primary-fixed-variant": "#003ea8",
              "inverse-primary": "#b4c5ff",
              "surface-container-highest": "#e1e2ed",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              sm: "8px",
              container_max_width: "1280px",
              xs: "4px",
              md: "16px",
              gutter: "24px",
              xxl: "48px",
              lg: "24px",
              xl: "32px",
              base: "4px",
            },
            fontFamily: {
              h3: ["Inter"],
              "body-md": ["Inter"],
              "label-caps": ["Inter"],
              h1: ["Inter"],
              button: ["Inter"],
              "body-sm": ["Inter"],
              h2: ["Inter"],
              "body-lg": ["Inter"],
            },
            fontSize: {
              h3: ["24px", { lineHeight: "1.3", fontWeight: "600" }],
              "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
              "label-caps": [
                "12px",
                { lineHeight: "1", letterSpacing: "0.05em", fontWeight: "600" },
              ],
              h1: [
                "36px",
                {
                  lineHeight: "1.2",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              button: ["16px", { lineHeight: "1", fontWeight: "600" }],
              "body-sm": ["14px", { lineHeight: "1.5", fontWeight: "400" }],
              h2: [
                "30px",
                {
                  lineHeight: "1.2",
                  letterSpacing: "-0.01em",
                  fontWeight: "700",
                },
              ],
              "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }
      .hero-overlay {
        background-color: rgba(37, 99, 235, 0.65);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e5e7eb;
        border-radius: 10px;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background text-on-surface font-body-md antialiased overflow-hidden"
  >
    <!-- Mobile Container (9:16 Ratio Simulation) -->
    <main
      class="relative h-screen w-full max-w-[450px] mx-auto bg-surface-container-lowest overflow-hidden flex flex-col shadow-2xl"
    >
      <!-- Section 1: Hero (30%) -->
      <section class="relative h-[30%] w-full flex-shrink-0">
        <div class="absolute inset-0 w-full h-full">
          <img
            alt="Athlete training"
            class="w-full h-full object-cover"
            data-alt="A professional high-performance athlete performing an intense workout in a moody, modern gym setting. The lighting is cinematic with deep contrasts, capturing the sweat and determination on the athlete's face. A vibrant blue overlay adds a professional, energetic brand feel, while keeping the background imagery clear but focused on the mood of achievement and strength."
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuAyG1um7IPXvHwE6nmE6ssYVVVjTC0r7ySzpfvgt2y3ijDIijH7cdNjytjqd5Oa3e9jK1RF5wHKmdUUf-YSEAMBk5r8X_iwU_FFJvq9JJxOThjq3heb3e_4_wu5D0oSkOVWQhhXAeYbZhuiYHUTlh2C6C3AvbX4_Rr-b7csHZluFjBH0a4Y1SCAN5aZGq1Yn5eKR8w62bsdtQOqInVJGgkV0MAeOv7YmvxlFJnbW8SHJPMZF92o5QuqYcC2mBc8-zyB6KOak0mzzlQ"
          />
          <div
            class="hero-overlay absolute inset-0 flex flex-col items-center justify-center text-center px-lg"
          >
            <h1 class="font-h2 text-h2 font-bold text-white tracking-tight">
              AC Training
            </h1>
          </div>
        </div>
        <!-- Section 2: Back Button -->
        <button
          class="absolute top-md left-md z-20 w-10 h-10 flex items-center justify-center bg-white/20 backdrop-blur-md rounded-full text-white active:scale-95 transition-all"
        >
          <span class="material-symbols-outlined" data-icon="arrow_back"
            >arrow_back</span
          >
        </button>
      </section>
      <!-- Section 3: Form Card (70%) -->
      <section
        class="relative -mt-8 flex-grow h-[70%] bg-surface-container-lowest rounded-t-[32px] overflow-hidden flex flex-col z-10"
      >
        <!-- Scrollable Content -->
        <div
          class="flex-grow overflow-y-auto custom-scrollbar pt-xl pb-xxl px-lg"
        >
          <!-- Header Text -->
          <div class="mb-xl">
            <h2 class="font-h2 text-h2 font-bold text-on-surface">
              Creá tu cuenta
            </h2>
            <p class="font-body-md text-on-surface-variant">
              Completá tus datos para empezar
            </p>
          </div>
          <!-- Form -->
          <form class="flex flex-col gap-5">
            <!-- Nombre -->
            <div class="flex flex-col gap-1.5">
              <label
                class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider"
                >Nombre</label
              >
              <input
                class="w-full px-md py-3.5 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all bg-surface-container-low placeholder:text-outline"
                placeholder="Nombre"
                type="text"
              />
            </div>
            <!-- Apellido -->
            <div class="flex flex-col gap-1.5">
              <label
                class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider"
                >Apellido</label
              >
              <input
                class="w-full px-md py-3.5 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all bg-surface-container-low placeholder:text-outline"
                placeholder="Apellido"
                type="text"
              />
            </div>
            <!-- Email -->
            <div class="flex flex-col gap-1.5">
              <label
                class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider"
                >Email</label
              >
              <input
                class="w-full px-md py-3.5 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all bg-surface-container-low placeholder:text-outline"
                placeholder="tu@email.com"
                type="email"
              />
            </div>
            <!-- Teléfono -->
            <div class="flex flex-col gap-1.5">
              <div class="flex justify-between items-center">
                <label
                  class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider"
                  >Teléfono</label
                >
                <span
                  class="px-2 py-0.5 bg-surface-container-high text-[10px] font-bold text-outline rounded uppercase"
                  >Opcional</span
                >
              </div>
              <input
                class="w-full px-md py-3.5 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all bg-surface-container-low placeholder:text-outline"
                placeholder="+54..."
                type="tel"
              />
            </div>
            <!-- Contraseña -->
            <div class="flex flex-col gap-1.5">
              <label
                class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider"
                >Contraseña</label
              >
              <div class="relative">
                <input
                  class="w-full px-md py-3.5 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all bg-surface-container-low placeholder:text-outline"
                  placeholder="••••••••"
                  type="password"
                />
                <button
                  class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface"
                  type="button"
                >
                  <span
                    class="material-symbols-outlined text-[20px]"
                    data-icon="visibility"
                    >visibility</span
                  >
                </button>
              </div>
            </div>
            <!-- Repetir contraseña -->
            <div class="flex flex-col gap-1.5">
              <label
                class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider"
                >Repetir contraseña</label
              >
              <input
                class="w-full px-md py-3.5 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all bg-surface-container-low placeholder:text-outline"
                placeholder="••••••••"
                type="password"
              />
            </div>
            <!-- Terms Checkbox -->
            <!-- Submit Button -->
            <button
              class="w-full bg-primary-container text-white py-4 px-md rounded-xl font-button text-button shadow-md active:scale-95 active:bg-primary transition-all mt-md"
              type="submit"
            >
              Crear cuenta
            </button>
            <!-- Footer -->
            <div class="mt-lg text-center">
              <p class="font-body-sm text-on-surface-variant">
                ¿Ya tenés cuenta?
                <a class="text-primary font-bold hover:underline" href="#"
                  >Iniciá sesión</a
                >
              </p>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
